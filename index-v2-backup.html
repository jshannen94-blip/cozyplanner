<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Cozy Planner</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0e0e0f" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Planner" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@200;300;400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #0e0e0f; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: Karla, system-ui, -apple-system, sans-serif;
    font-weight: 300; font-size: 16px; color: #e8e6e3;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
  }
  button, input { font-family: inherit; font-weight: inherit; }
  input { -webkit-appearance: none; appearance: none; }
  input:focus { outline: none; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  .tap { transition: opacity 140ms ease; cursor: pointer; }
  .tap:active { opacity: 0.55; }
  .fade { animation: fade 260ms ease both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .box { transition: border-color 160ms ease, background 160ms ease; }
</style>
</head>
<body>
<div id="app"></div>
<script src="store.js"></script>
<script>
(function () {
  'use strict';
  var K = window.Store;

  var S = {
    view: 'day',
    cursor: new Date(),
    now: new Date(),
    tasks: K.tasks(),
    adding: false,
    editMode: false,
    settingsOpen: false
  };

  var MUTED = '#6b6864', DIM = '#4a4845', TEXT = '#e8e6e3', LINE = '#1f1f21';
  var ACCENTS = ['#b08b90', '#f0eee6', '#779f7c', '#78959b'];
  function AC() { var a = K.prefs().accent; return ACCENTS.indexOf(a) === -1 ? '#b08b90' : a; }

  function isPhone() { return window.innerWidth < 620; }

  /* ---------- header ---------- */
  function dateNav() {
    var d = S.cursor;
    var label = S.view === 'month'
      ? d.toLocaleDateString(undefined, { month: 'long', year: 'numeric' })
      : S.view === 'week'
        ? 'Week of ' + startOfWeek(d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })
        : d.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
    return '<div style="display: flex; align-items: center; justify-content: center; gap: 14px; padding: 22px 20px 0;">'
      + '<button class="tap" data-act="prev" style="background: none; border: none; color: ' + DIM + '; font-size: 17px; padding: 8px 10px; line-height: 1;">‹</button>'
      + '<button class="tap" data-act="today" style="background: none; border: none; color: ' + MUTED + '; font-size: 11.5px; letter-spacing: 0.22em; text-transform: uppercase; padding: 8px 4px; white-space: nowrap;">' + K.esc(label) + '</button>'
      + '<button class="tap" data-act="next" style="background: none; border: none; color: ' + DIM + '; font-size: 17px; padding: 8px 10px; line-height: 1;">›</button>'
      + '</div>';
  }

  function viewSwitch() {
    return '<div style="display: flex; justify-content: center; gap: 26px; padding: 26px 0 4px;">'
      + ['day', 'week', 'month'].map(function (v) {
        var on = S.view === v;
        return '<button class="tap" data-act="view" data-v="' + v + '" style="background: none; border: none; padding: 6px 2px; font-size: 11.5px; letter-spacing: 0.2em; text-transform: uppercase; color: ' + (on ? TEXT : DIM) + ';">' + v + '</button>';
      }).join('') + '</div>';
  }

  function startOfWeek(d) {
    var ws = K.prefs().weekStart === 1 ? 1 : 0;
    var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate() - ((x.getDay() - ws + 7) % 7));
    return x;
  }

  /* ---------- day view ---------- */
  function dayView() {
    var cur = S.cursor;
    var isToday = K.sameDay(cur, S.now);
    var heading = isToday ? 'Today'
      : K.sameDay(cur, K.addDays(S.now, 1)) ? 'Tomorrow'
      : K.sameDay(cur, K.addDays(S.now, -1)) ? 'Yesterday'
      : cur.toLocaleDateString(undefined, { weekday: 'long' });

    var evs = K.eventsFor(cur, { includeHidden: S.editMode });
    var hid = K.hiddenList();
    var open = S.tasks.filter(function (t) { return !t.done; });
    var done = S.tasks.filter(function (t) { return t.done; });
    var collapsed = K.readLS('collapsed_v1', {});

    function sectionShell(id, label, meta, accent, rows, adder) {
      var isOpen = !collapsed[id];
      return '<div class="fade" style="background: #131315; border-radius: 14px; padding: 4px 16px 6px; margin-top: 14px;">'
        + '<button class="tap" data-act="collapse" data-id="' + id + '" style="width: 100%; display: flex; align-items: center; gap: 10px; background: none; border: none; padding: 14px 0 10px; text-align: left;">'
        + (accent ? '<span style="width: 5px; height: 5px; border-radius: 999px; flex: none; background: ' + accent + ';"></span>' : '')
        + '<span style="flex: 1; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: ' + MUTED + ';">' + K.esc(label) + '</span>'
        + (meta ? '<span style="font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: ' + (collapsed[id] ? MUTED : DIM) + ';">' + K.esc(meta) + (collapsed[id] ? ' · hidden' : '') + '</span>' : '')
        + '<span style="font-size: 10px; color: ' + DIM + '; transform: rotate(' + (isOpen ? '90' : '0') + 'deg); transition: transform 160ms ease;">›</span>'
        + '</button>'
        + (isOpen ? rows + adder : '') + '</div>';
    }

    function adderRow(act, cat, label) {
      if (S.adding === (cat || act)) {
        return '<div style="display: flex; align-items: center; gap: 12px; padding: 10px 0 14px;">'
          + '<span style="color: ' + DIM + '; font-size: 16px;">+</span>'
          + '<input id="newTask" data-cat="' + K.esc(cat || '') + '" data-kind="' + act + '" placeholder="' + K.esc(label) + '" autocomplete="off" autocapitalize="sentences" enterkeyhint="done" style="flex: 1; background: none; border: none; color: ' + TEXT + '; font-size: 16px; padding: 4px 0;" />'
          + (act === 'event' ? '<input id="newTime" type="time" style="width: 108px; background: none; border: none; color: ' + MUTED + '; font-size: 14px; color-scheme: dark;" />' : '')
          + '<button class="tap" data-act="saveInline" style="background: none; border: none; color: ' + AC() + '; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; padding: 6px 2px;">Add</button></div>';
      }
      return '<button class="tap" data-act="addInline" data-kind="' + act + '" data-v="' + K.esc(cat || '') + '" style="width: 100%; display: flex; align-items: center; gap: 12px; background: none; border: none; padding: 12px 0 14px; text-align: left; color: ' + DIM + '; font-size: 15.5px;">'
        + '<span style="font-size: 16px;">+</span><span>' + K.esc(label) + '</span></button>';
    }

    var eventRows = evs.map(function (e) {
      var isHid = hid.indexOf(K.evKey(e)) !== -1;
      return '<div class="tap" ' + (S.editMode ? 'data-act="hide" data-k="' + K.esc(K.evKey(e)) + '"' : '')
        + ' style="display: flex; align-items: baseline; gap: 14px; padding: 12px 0; border-top: 1px solid ' + LINE + '; opacity: ' + (isHid ? 0.3 : 1) + ';">'
        + '<span style="min-width: 58px; font-size: 12.5px; letter-spacing: 0.06em; color: ' + DIM + ';">' + K.esc(e.allDay ? 'All day' : K.t12(e.startTime)) + '</span>'
        + '<span style="flex: 1; font-size: 16px; line-height: 1.5; color: ' + TEXT + '; text-wrap: pretty;">' + K.esc(e.title) + '</span>'
        + '<span style="width: 5px; height: 5px; border-radius: 999px; background: ' + e.color + '; flex: none; align-self: center;"></span></div>';
    }).join('');

    var body = sectionShell('sched', 'Schedule', evs.length ? String(evs.length) : '', null,
      eventRows || '<div style="padding: 12px 0; border-top: 1px solid ' + LINE + '; font-size: 15px; color: ' + DIM + ';">Nothing scheduled.</div>',
      adderRow('event', null, 'Add an event'));

    body += sectionShell('cat-To-do', 'To-do', open.length ? open.length + ' open' : '', AC(),
      open.map(taskLine).join('') || '<div style="padding: 12px 0; border-top: 1px solid ' + LINE + '; font-size: 15px; color: ' + DIM + ';">Nothing to do.</div>',
      adderRow('task', 'To-do', 'Add a task'));

    if (done.length) {
      body += sectionShell('done', 'Done', String(done.length), null, done.map(taskLine).join(''), '');
    }

    return '<div style="flex: 1; display: flex; flex-direction: column; padding: 0 22px 24px;">'
      + '<h1 style="margin: 14px 0 0; font-size: ' + (isPhone() ? '44px' : '52px') + '; font-weight: 200; letter-spacing: -0.02em; color: ' + TEXT + ';">' + K.esc(heading) + '</h1>'
      + '<button class="tap" data-act="tasksPage" style="align-self: flex-start; margin-top: 10px; background: none; border: none; padding: 6px 0; white-space: nowrap; flex: none; font-size: 11.5px; letter-spacing: 0.2em; text-transform: uppercase; color: ' + DIM + ';">All tasks →</button>'
      + body + '</div>';
  }

  function taskLine(t) {
    var color = AC();
    return '<div style="display: flex; align-items: center; gap: 14px; padding: 11px 0; border-top: 1px solid ' + LINE + ';">'
      + '<button class="tap box" data-act="toggle" data-id="' + t.id + '" style="width: 20px; height: 20px; flex: none; border-radius: 999px; display: flex; align-items: center; justify-content: center; padding: 0; border: 1px solid ' + (t.done ? color : '#38363a') + '; background: ' + (t.done ? color : 'transparent') + ';">'
      + '<svg viewBox="0 0 12 12" fill="none" style="width: 11px; height: 11px; opacity: ' + (t.done ? 1 : 0) + ';"><polyline points="2,6 5,9 10,3" stroke="#0e0e0f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></polyline></svg></button>'
      + '<span style="flex: 1; font-size: 16px; line-height: 1.5; ' + (t.done ? 'color: ' + DIM + '; text-decoration: line-through;' : 'color: ' + TEXT + ';') + '">' + K.esc(t.text) + '</span>'
      + '<button class="tap" data-act="del" data-id="' + t.id + '" style="background: none; border: none; color: #343235; font-size: 17px; padding: 6px 6px;">×</button>'
      + '</div>';
  }

  /* ---------- week view ---------- */
  function weekView() {
    var base = startOfWeek(S.cursor), phone = true, out = '';
    for (var i = 0; i < 7; i++) {
      var d = K.addDays(base, i), today = K.sameDay(d, S.now);
      var evs = K.eventsFor(d, { includeHidden: S.editMode });
      var rows = evs.map(function (e) {
        return '<div style="display: flex; align-items: baseline; gap: 12px; padding: 9px 0;">'
          + '<span style="min-width: 54px; font-size: 12px; color: ' + DIM + ';">' + K.esc(e.allDay ? '' : K.t12(e.startTime)) + '</span>'
          + '<span style="flex: 1; font-size: 15px; line-height: 1.45; color: ' + TEXT + '; overflow-wrap: anywhere; text-wrap: pretty;">' + K.esc(e.title) + '</span>'
          + '<span style="width: 4px; height: 4px; border-radius: 999px; background: ' + e.color + '; flex: none; align-self: center;"></span></div>';
      }).join('');
      out += '<div style="' + (phone ? '' : 'display: flex; flex-direction: column; min-height: 0;') + ' padding: ' + (phone ? '16px 0' : '0') + '; border-bottom: ' + (phone ? '1px solid ' + LINE : 'none') + ';">'
        + '<button class="tap" data-act="goday" data-d="' + K.isoDate(d) + '" style="display: flex; align-items: baseline; gap: 10px; background: none; border: none; padding: ' + (phone ? '0 0 6px' : '0 0 12px') + '; text-align: left;">'
        + '<span style="font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: ' + (today ? AC() : DIM) + ';">' + K.esc(d.toLocaleDateString(undefined, { weekday: 'short' })) + '</span>'
        + '<span style="font-size: 17px; font-weight: 300; color: ' + (today ? TEXT : MUTED) + ';">' + d.getDate() + '</span></button>'
        + '<div style="flex: 1;">' + rows + '</div></div>';
    }
    return '<div style="padding: 30px 22px 20px; display: ' + (phone ? 'flex' : 'grid') + '; ' + (phone ? 'flex-direction: column;' : 'grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 22px; align-items: stretch; flex: 1;') + '">' + out + '</div>';
  }

  /* ---------- month view ---------- */
  function monthView() {
    var cur = S.cursor, gridStart = startOfWeek(new Date(cur.getFullYear(), cur.getMonth(), 1));
    var phone = isPhone();
    var head = '';
    for (var w = 0; w < 7; w++) {
      head += '<div style="text-align: center; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: ' + DIM + ';">'
        + K.esc(addDaysLabel(gridStart, w)) + '</div>';
    }
    var cells = '';
    for (var i = 0; i < 42; i++) {
      var d = K.addDays(gridStart, i);
      if (i >= 35 && d.getMonth() !== cur.getMonth()) continue;
      var inMonth = d.getMonth() === cur.getMonth(), today = K.sameDay(d, S.now);
      var evs = K.eventsFor(d, {});
      var marks = '';
      if (phone) {
        marks = evs.length ? '<div style="display: flex; gap: 3px; justify-content: center; margin-top: 5px;">'
          + evs.slice(0, 3).map(function (e) { return '<span style="width: 4px; height: 4px; border-radius: 999px; background: ' + e.color + ';"></span>'; }).join('')
          + '</div>' : '';
      } else {
        marks = evs.slice(0, 3).map(function (e) {
          return '<div style="display: flex; align-items: flex-start; gap: 6px; margin-top: 5px;">'
            + '<span style="width: 4px; height: 4px; border-radius: 999px; background: ' + e.color + '; flex: none; margin-top: 5px;"></span>'
            + '<span style="font-size: 11.5px; line-height: 1.35; color: ' + MUTED + '; overflow-wrap: anywhere;">' + K.esc(e.title) + '</span></div>';
        }).join('') + (evs.length > 3 ? '<div style="margin-top: 4px; font-size: 10.5px; color: ' + DIM + ';">+' + (evs.length - 3) + '</div>' : '');
      }
      cells += '<button class="tap" data-act="goday" data-d="' + K.isoDate(d) + '" style="display: flex; flex-direction: column; align-items: ' + (phone ? 'center' : 'stretch') + '; background: none; border: none; padding: ' + (phone ? '10px 2px' : '9px 6px 12px') + '; min-height: ' + (phone ? '54px' : '96px') + '; text-align: left; opacity: ' + (inMonth ? 1 : 0.3) + ';">'
        + '<span style="font-size: ' + (phone ? '15px' : '14px') + '; color: ' + (today ? TEXT : MUTED) + '; ' + (today ? 'font-weight: 500;' : '') + '">' + d.getDate() + '</span>'
        + marks + '</button>';
    }
    return '<div style="padding: 30px 16px 20px; display: flex; flex-direction: column; gap: 10px;">'
      + '<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px;">' + head + '</div>'
      + '<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px;">' + cells + '</div></div>';
  }
  function addDaysLabel(base, n) { return K.addDays(base, n).toLocaleDateString(undefined, { weekday: 'narrow' }); }

  /* ---------- add bar ---------- */
  function addBar() {
    if (S.adding) {
      return '<div style="border-top: 1px solid ' + LINE + '; padding: 16px 22px calc(16px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 14px; background: #0e0e0f;">'
        + '<span style="color: ' + DIM + '; font-size: 17px;">+</span>'
        + '<input id="newTask" placeholder="Add a task" autocomplete="off" autocapitalize="sentences" enterkeyhint="done" style="flex: 1; background: none; border: none; color: ' + TEXT + '; font-size: 16.5px; padding: 6px 0;" />'
        + '<button class="tap" data-act="saveTask" style="background: none; border: none; color: ' + AC() + '; font-size: 11.5px; letter-spacing: 0.2em; text-transform: uppercase; padding: 8px 2px;">Add</button></div>';
    }
    return '<button class="tap" data-act="add" style="width: 100%; border: none; border-top: 1px solid ' + LINE + '; background: #0e0e0f; color: ' + MUTED + '; display: flex; align-items: center; gap: 16px; padding: 20px 22px calc(20px + env(safe-area-inset-bottom)); font-size: 16.5px; text-align: left;">'
      + '<span style="color: ' + DIM + '; font-size: 17px;">+</span><span>Add a task</span></button>';
  }

  /* ---------- settings ---------- */
  function settings() {
    if (!S.settingsOpen) return '';
    var hid = K.hiddenList();
    var rows = K.CALENDARS.map(function (c) {
      var name = c.id.indexOf('group.calendar') !== -1 ? 'Family calendar' : c.id;
      return '<div style="display: flex; align-items: center; gap: 11px; padding: 11px 0; border-bottom: 1px solid ' + LINE + ';">'
        + '<span style="width: 5px; height: 5px; border-radius: 999px; flex: none; background: ' + c.color + ';"></span>'
        + '<span style="flex: 1; min-width: 0; font-size: 13.5px; color: ' + MUTED + '; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">' + K.esc(name) + '</span></div>';
    }).join('');
    var line = 'display: flex; align-items: center; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid ' + LINE + ';';
    var lbl = 'font-size: 15px; color: ' + TEXT + ';';
    var btn = 'background: none; border: none; color: ' + MUTED + '; font-size: 11.5px; letter-spacing: 0.18em; text-transform: uppercase; padding: 6px 2px;';
    return '<div class="fade" style="position: fixed; inset: 0; background: #0e0e0f; z-index: 60; overflow: auto; padding: calc(24px + env(safe-area-inset-top)) 22px calc(30px + env(safe-area-inset-bottom));">'
      + '<div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px;">'
      + '<span style="font-size: 26px; font-weight: 200; color: ' + TEXT + ';">Settings</span>'
      + '<button class="tap" data-act="closeSettings" style="background: none; border: none; color: ' + MUTED + '; font-size: 20px; padding: 8px;">×</button></div>'
      + '<div style="font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: ' + DIM + '; margin-bottom: 12px;">Google Calendar key</div>'
      + '<input id="apiInput" value="' + K.esc(K.apiKey()) + '" placeholder="AIza…" style="width: 100%; background: none; border: none; border-bottom: 1px solid #2a2a2c; color: ' + TEXT + '; font-size: 15px; padding: 10px 0;" />'
      + '<div style="display: flex; gap: 22px; margin-top: 14px;">'
      + '<button class="tap" data-act="saveKey" style="' + btn + ' color: ' + AC() + ';">Save &amp; sync</button>'
      + '<button class="tap" data-act="refresh" style="' + btn + '">Refresh</button>'
      + '<button class="tap" data-act="clearCal" style="' + btn + '">Clear cache</button></div>'
      + gcalDiag()
      + '<div style="margin-top: 34px; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: ' + DIM + '; margin-bottom: 6px;">Calendars</div>' + rows
      + '<div style="' + line + ' margin-top: 20px;"><span style="' + lbl + '">Accent color</span>'
      + '<div style="display: flex; gap: 10px;">' + ACCENTS.map(function (col) {
          return '<button class="tap" data-act="accent" data-v="' + col + '" style="width: 26px; height: 26px; border-radius: 999px; background: ' + col + '; border: 1px solid ' + (AC() === col ? TEXT : 'transparent') + '; box-shadow: 0 0 0 2px #0e0e0f inset; padding: 0;"></button>';
        }).join('') + '</div></div>'
      + '<div style="' + line + '"><span style="' + lbl + '">Show holidays</span>'
      + '<button class="tap" data-act="holidays" style="' + btn + '">' + (K.prefs().showHolidays !== false ? 'On' : 'Off') + '</button></div>'
      + '<div style="' + line + '"><span style="' + lbl + '">Week starts</span>'
      + '<button class="tap" data-act="weekstart" style="' + btn + '">' + (K.prefs().weekStart === 1 ? 'Monday' : 'Sunday') + '</button></div>'
      + '<div style="' + line + '"><span style="' + lbl + '">Hide events</span>'
      + '<button class="tap" data-act="edit" style="' + btn + '">' + (S.editMode ? 'Editing' : 'Off') + '</button></div>'
      + (hid.length ? '<button class="tap" data-act="unhideAll" style="margin-top: 24px; width: 100%; background: none; border: 1px solid #2a2a2c; border-radius: 10px; color: ' + MUTED + '; font-size: 14px; padding: 14px;">Show ' + hid.length + ' hidden event' + (hid.length === 1 ? '' : 's') + '</button>' : '')
      + syncSection()
      + '<div style="margin-top: 30px; font-size: 12.5px; line-height: 1.6; color: ' + DIM + ';">Tasks and events are saved in this browser. Add to home screen for full-screen mode.</div>'
      + '</div>';
  }

  function gcalDiag() {
    var g = K.gcalStatus();
    var line = !K.apiKey() ? 'No key saved — the schedule will only show holidays and events you add here.'
      : g.state === 'fetching' ? 'Contacting Google…'
      : g.state === 'ok' ? g.fetched + ' events returned, ' + g.cached + ' cached'
      : g.state === 'empty' ? 'Google replied with 0 events. Usually the key is restricted, or the calendars are not shared publicly.'
      : g.cached ? g.cached + ' events in cache (no fetch yet this session)'
      : 'No response yet.';
    var per = (g.perCal || []).map(function (c) {
      return '<div style="display: flex; justify-content: space-between; padding: 4px 0;"><span>' + K.esc(c.id) + '</span><span style="color: ' + (c.n ? '#84a08d' : '#b08b90') + ';">' + c.n + '</span></div>';
    }).join('');
    return '<div style="margin-top: 12px; font-size: 12.5px; line-height: 1.6; color: ' + DIM + ';">' + K.esc(line) + '</div>'
      + (per ? '<div style="margin-top: 8px; font-size: 12px; color: ' + MUTED + ';">' + per + '</div>' : '');
  }

  function syncSection() {
    var c = K.Sync.cfg(), st = K.Sync.status();
    var jb = c.provider === 'jsonbin';
    var ready = K.Sync.on();
    var label = !ready ? 'Not connected'
      : st.state === 'syncing' ? 'Syncing…'
      : st.state === 'ok' ? 'Synced at ' + K.clock12(new Date(st.at))
      : st.state === 'error' ? st.msg
      : 'Ready';
    var dot = st.state === 'error' ? '#b08b90' : st.state === 'ok' ? '#84a08d' : DIM;

    function pick(id, name) {
      var on = c.provider === id;
      return '<button class="tap" data-act="syncProvider" data-v="' + id + '" style="flex: 1; background: ' + (on ? '#1c1c1f' : 'none') + '; border: 1px solid ' + (on ? '#33333a' : '#1f1f21') + '; border-radius: 10px; padding: 13px 10px; color: ' + (on ? TEXT : DIM) + '; font-size: 13.5px;">' + name + '</button>';
    }

    function field(id, value, label, hint, placeholder) {
      return '<div style="margin-top: 20px;">'
        + '<div style="font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: ' + MUTED + '; margin-bottom: 3px;">' + K.esc(label) + '</div>'
        + '<div style="font-size: 12px; line-height: 1.5; color: ' + DIM + '; margin-bottom: 6px;">' + hint + '</div>'
        + '<input id="' + id + '" value="' + K.esc(value) + '" placeholder="' + K.esc(placeholder) + '" autocomplete="off" spellcheck="false" style="width: 100%; background: #17171a; border: 1px solid #26262a; border-radius: 9px; color: ' + TEXT + '; font-size: 14px; padding: 12px 13px;" /></div>';
    }

    var fields = c.provider === 'jsonblob'
      ? field('syncUrl', c.url, 'Step 2 · Store ID', (c.url ? 'An id is ready. Tap Connect, then copy this id onto your other device. Tap New store only if you want a fresh one.' : 'Tap “New store” below and this fills itself in. Copy the id onto your other device.'), '1234567890123456789')
      : jb
      ? field('syncUrl', c.url, 'Step 2 · Bin ID', 'jsonbin.io → Create Bin → paste <code style="color:' + MUTED + '">{"tasks":[]}</code> → Save. The id is in the address bar.', '68a1f3c2ad19ca34f8b5d901')
        + field('syncKey', c.key, 'Step 3 · Master key', 'jsonbin.io → API Keys → Master Key.', '$2a$10$…')
      : field('syncUrl', c.url, 'Step 2 · Project URL', 'supabase.com → your project → Settings → API → Project URL.', 'https://abcdefg.supabase.co')
        + field('syncKey', c.key, 'Step 3 · Anon public key', 'Same page, under Project API keys → anon public.', 'eyJhbGciOi…')
        + field('syncCode', c.code, 'Step 4 · Sync word', 'Any private phrase. Type the identical word on every device.', 'plum-otter-4417');

    var steps = c.provider === 'jsonblob'
      ? '1. Tap New store — that is the whole setup.<br>2. Copy the Store ID it fills in.<br>3. On your other device, pick Simple, paste that id, tap Connect.<br>Anyone with the id can read the data, so keep it to yourself.'
      : jb
      ? '1. Sign up free at jsonbin.io.<br>2. Create a bin with <code style="color: ' + TEXT + ';">{"tasks":[]}</code> inside, save it, copy its id.<br>3. Copy your Master Key from API Keys.<br>4. Paste both above, then repeat on your other device.'
      : '1. Make a free project at supabase.com.<br>2. In the SQL editor, run the snippet below.<br>3. Copy the Project URL and anon key from Settings → API.<br>4. Choose one sync word and reuse it everywhere.'
        + '<code style="display: block; margin: 10px 0 0; padding: 11px 12px; background: #17171a; border-radius: 8px; font-size: 11.5px; line-height: 1.65; color: ' + TEXT + '; white-space: pre-wrap;">create table planner (\n  code text primary key,\n  data jsonb,\n  updated_at timestamptz\n);\nalter table planner enable row level security;\ncreate policy anon_all on planner\n  for all to anon using (true) with check (true);</code>';

    return '<div style="margin-top: 38px; border-top: 1px solid ' + LINE + '; padding-top: 26px;">'
      + '<div style="display: flex; align-items: center; gap: 9px; margin-bottom: 4px;">'
      + '<span style="width: 5px; height: 5px; border-radius: 999px; background: ' + dot + ';"></span>'
      + '<span style="font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: ' + MUTED + ';">Sync across devices</span></div>'
      + '<div style="font-size: 12.5px; color: ' + (st.state === 'error' ? '#b08b90' : DIM) + '; margin-bottom: 18px;">' + K.esc(label) + '</div>'

      + '<div style="font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: ' + MUTED + '; margin-bottom: 8px;">Step 1 · Where to store it</div>'
      + '<div style="display: flex; gap: 8px;">' + pick('jsonblob', 'Simple') + pick('jsonbin', 'JSONBin') + pick('supabase', 'Supabase') + '</div>'
      + (c.provider === 'jsonblob' ? '<div style="margin-top: 8px; font-size: 12px; line-height: 1.55; color: ' + DIM + ';">No account, no keys. One tap makes a store; paste its id on your other device.</div>' : '')

      + fields

      + '<div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px;">'
      + (c.provider === 'jsonblob'
        ? '<button class="tap" data-act="createStore" style="flex: 1 1 100%; background: ' + AC() + '; border: none; border-radius: 10px; color: #141212; font-size: 13.5px; padding: 14px;">New store</button>'
          + '<button class="tap" data-act="saveSync" style="flex: 1; background: none; border: 1px solid #26262a; border-radius: 10px; color: ' + MUTED + '; font-size: 13.5px; padding: 14px;">Connect</button>'
        : '<button class="tap" data-act="saveSync" style="flex: 1; background: ' + AC() + '; border: none; border-radius: 10px; color: #141212; font-size: 13.5px; padding: 14px;">Connect</button>')
      + '<button class="tap" data-act="syncNow" style="background: none; border: 1px solid #26262a; border-radius: 10px; color: ' + MUTED + '; font-size: 13.5px; padding: 14px 18px;">Sync now</button></div>'

      + '<button class="tap" data-act="syncHelp" style="margin-top: 14px; background: none; border: none; padding: 6px 0; font-size: 11.5px; letter-spacing: 0.18em; text-transform: uppercase; color: ' + DIM + ';">' + (S.syncHelp ? 'Hide steps' : 'Full steps') + '</button>'
      + (S.syncHelp ? '<div style="margin-top: 6px; font-size: 12.5px; line-height: 1.75; color: ' + MUTED + ';">' + steps + '</div>' : '')
      + '</div>';
  }

  /* ---------- render ---------- */
  function isTyping() {
    var a = document.activeElement;
    return !!(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA'));
  }
  var pendingPassive = false;

  var lastHTML = '';
  function render(passive) {
    if (passive && isTyping()) { pendingPassive = true; return; }
    var main = S.view === 'day' ? dayView() : S.view === 'week' ? weekView() : monthView();
    var cap = S.view === 'month' ? 1240 : 620;
    var html =
      '<div style="min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; background: #0e0e0f; padding-top: env(safe-area-inset-top);">'
      + '<div style="width: 100%; max-width: ' + cap + 'px; margin: 0 auto; flex: 1; display: flex; flex-direction: column;">'
      + dateNav()
      + '<div style="flex: 1; display: flex; flex-direction: column;">' + main + '</div>'
      + viewSwitch()
      + '<button class="tap" data-act="settings" style="align-self: center; background: none; border: none; color: #2f2d31; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; padding: 10px 16px 6px;">Settings</button>'
      + (S.view === 'day' ? '' : addBar())
      + '</div>' + settings() + '</div>';
    if (html === lastHTML) return;
    lastHTML = html;
    document.getElementById('app').innerHTML = html;
    var f = document.getElementById('newTask');
    if (f && document.activeElement !== f) f.focus();
  }

  document.addEventListener('focusout', function () {
    setTimeout(function () {
      if (pendingPassive && !isTyping()) { pendingPassive = false; render(); }
    }, 60);
  });

  function goToday() {
    S.cursor = new Date();
    S.now = new Date();
    S.tasks = K.tasks();
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'newTask') {
      if (e.target.hasAttribute('data-kind')) saveInline();
      else { S.tasks = K.addTask(e.target.value, 'To-do'); K.buzz(12); e.target.value = ''; }
      render();
    }
    if (e.key === 'Enter' && e.target.id === 'apiInput') { K.setApiKey(e.target.value.trim()); K.syncRange(S.cursor, function () { render(true); }); }
    if (e.key === 'Escape') { S.adding = false; S.settingsOpen = false; render(); }
  });

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act'), v = el.getAttribute('data-v');
    switch (act) {
      case 'view': S.view = v; K.buzz(8); break;
      case 'prev': shift(-1); K.buzz(8); break;
      case 'next': shift(1); K.buzz(8); break;
      case 'today': goToday(); K.buzz(8); break;
      case 'goday': var p = el.getAttribute('data-d').split('-'); S.cursor = new Date(+p[0], +p[1] - 1, +p[2]); S.view = 'day'; K.buzz(8); break;
      case 'tasksPage': K.buzz(8); window.location.href = 'tasks.html'; return;
      case 'add': S.adding = true; break;
      case 'addInline': S.adding = el.getAttribute('data-kind') === 'event' ? 'event' : v; break;
      case 'collapse':
        var cmap = K.readLS('collapsed_v1', {});
        var cid = el.getAttribute('data-id');
        cmap[cid] = !cmap[cid];
        K.writeLS('collapsed_v1', cmap); K.buzz(8); break;
      case 'saveInline': saveInline(); break;
      case 'saveTask':
        var input = document.getElementById('newTask');
        S.tasks = K.addTask(input ? input.value : '', 'To-do'); K.buzz(12);
        if (input) input.value = '';
        break;
      case 'toggle': S.tasks = K.toggleTask(el.getAttribute('data-id')); K.buzz(14); break;
      case 'del': S.tasks = K.removeTask(el.getAttribute('data-id')); K.buzz(18); break;
      case 'hide': K.toggleHidden(el.getAttribute('data-k')); K.buzz(12); break;
      case 'unhideAll': K.writeLS('hidden_events_v1', []); K.buzz(12); break;
      case 'edit': S.editMode = !S.editMode; break;
      case 'settings': S.settingsOpen = true; K.buzz(8); break;
      case 'closeSettings': S.settingsOpen = false; break;
      case 'holidays': var p1 = K.prefs(); p1.showHolidays = !(p1.showHolidays !== false); K.savePrefs(p1); break;
      case 'accent': var p3 = K.prefs(); p3.accent = el.getAttribute('data-v'); K.savePrefs(p3); K.buzz(8); break;
      case 'weekstart': var p2 = K.prefs(); p2.weekStart = p2.weekStart === 1 ? 0 : 1; K.savePrefs(p2); break;
      case 'saveKey':
        var ai = document.getElementById('apiInput');
        K.setApiKey(ai ? ai.value.trim() : ''); K.buzz(12);
        K.syncRange(S.cursor, function () { render(true); }); break;
      case 'refresh': K.syncRange(S.cursor, function () { render(true); }); break;
      case 'clearCal': K.clearCalCache(); K.buzz(12); K.syncRange(S.cursor, render); break;
      case 'syncHelp': S.syncHelp = !S.syncHelp; break;
      case 'createStore':
        K.buzz(12);
        K.Sync.createBlob()
          .then(function () { return K.Sync.run(); })
          .then(function () { S.tasks = K.tasks(); render(); })
          .catch(function (err) { alert('Could not create the store: ' + err.message); });
        break;
      case 'syncProvider':
        var sc = K.Sync.cfg(); sc.provider = v; K.Sync.saveCfg(sc); K.buzz(8); break;
      case 'saveSync':
        K.Sync.saveCfg({
          provider: K.Sync.cfg().provider,
          url: ((document.getElementById('syncUrl') || {}).value || '').trim(),
          key: ((document.getElementById('syncKey') || {}).value || '').trim(),
          code: ((document.getElementById('syncCode') || {}).value || '').trim().toLowerCase()
        });
        K.buzz(12);
        K.Sync.run().then(function () { S.tasks = K.tasks(); render(); });
        break;
      case 'syncNow':
        K.buzz(10);
        K.Sync.run().then(function () { S.tasks = K.tasks(); render(); });
        break;
      default: return;
    }
    render();
  });

  function saveInline() {
    var input = document.getElementById('newTask');
    if (!input || !input.value.trim()) { S.adding = false; return; }
    if (input.getAttribute('data-kind') === 'event') {
      var time = document.getElementById('newTime');
      K.saveLocalEvents(K.localEvents().concat({
        id: 'le' + Date.now(), title: input.value.trim(), date: K.isoDate(S.cursor),
        time: time && time.value ? time.value : '', repeat: 'none', exceptions: [], color: AC()
      }));
    } else {
      S.tasks = K.addTask(input.value, input.getAttribute('data-cat') || 'To-do');
    }
    K.buzz(12);
    S.adding = false;
  }

  function shift(n) {
    var before = S.cursor.getMonth();
    S.cursor = S.view === 'month'
      ? new Date(S.cursor.getFullYear(), S.cursor.getMonth() + n, 1)
      : K.addDays(S.cursor, S.view === 'week' ? 7 * n : n);
    if (before !== S.cursor.getMonth()) K.syncRange(S.cursor, function () { render(true); });
  }

  /* swipe between days / weeks / months on touch */
  var sx = 0, sy = 0, tracking = false;
  document.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1 || S.settingsOpen || S.adding || isTyping()) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; tracking = true;
  }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (!tracking) return;
    tracking = false;
    if (isTyping()) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.6) {
      shift(dx < 0 ? 1 : -1); K.buzz(10); render();
    }
  }, { passive: true });

  var resizeTimer, lastW = window.innerWidth;
  window.addEventListener('resize', function () {
    if (window.innerWidth === lastW) return;   // height-only change = keyboard opening
    lastW = window.innerWidth;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { render(true); }, 200);
  });

  window.addEventListener('pageshow', function () { S.tasks = K.tasks(); render(true); });
  window.addEventListener('storage', function () { S.tasks = K.tasks(); render(true); });

  K.hydrateCache();
  goToday();
  render();
  K.Sync.onChange(function () { S.tasks = K.tasks(); render(true); });
  K.Sync.start();
  K.syncRange(S.cursor, function () { render(true); });
  K.watchDayChange(function () { goToday(); render(true); });
  setInterval(function () { S.now = new Date(); }, 30000);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
