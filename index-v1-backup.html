<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cozy Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300..600&family=Karla:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #0d0d0d; }
  * { box-sizing: border-box; }
  body { font-family: Karla, system-ui, sans-serif; font-size: 16px; color: #f2f2f2; }
  a { color: #c9848a; text-decoration: none; }
  a:hover { color: #dda0a5; }
  input, select, button { font-family: inherit; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #333333; border-radius: 8px; border: 3px solid #121212; }
  ::-webkit-scrollbar-track { background: transparent; }
  @keyframes cozyIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes cozyFade { from { opacity: 0; } to { opacity: 1; } }
  .pill { transition: transform 160ms ease, background 160ms ease, border-color 160ms ease; }
  .pill:hover { filter: brightness(1.08); }
  .ghost { transition: background 160ms ease, color 160ms ease, border-color 160ms ease; }
  .ghost:hover { background: #2a2a2a; color: #ededed; }
  .fab { transition: filter 160ms ease; }
  .fab:hover { filter: brightness(1.08); }
  .cell { transition: filter 150ms ease; }
  .cell:hover { filter: brightness(1.12); }
  .taskrow { transition: filter 150ms ease; }
  .taskrow:hover { filter: brightness(1.15); }
  .del { background: none; border: none; color: #4b4b4b; cursor: pointer; font-size: 13px; padding: 2px 4px; }
  .del:hover { color: #c9848a; }
  input:focus { border-color: #454545 !important; outline: none; }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';

  /* ------------ config ------------ */
  var API_KEY_LS = 'gcal_api_key';
  var CALENDARS = [
    { id: 'jshannen94@gmail.com', color: '#c9848a', priority: 1 },
    { id: 'zachjonespp46@gmail.com', color: '#7ea8c4', priority: 2 },
    { id: 'family16142968416040620456@group.calendar.google.com', color: '#c4aa6a', priority: 2 },
    { id: 'xoshannen94@gmail.com', color: '#7a7a7e', priority: 3 }
  ];
  var CATS = [
    { name: 'To-do', color: '#c9848a' },
    { name: 'Grocery', color: '#7aab8a' },
    { name: 'Idea', color: '#c4aa6a' },
    { name: 'Goal', color: '#a888c9' }
  ];
  var ACCENTS = ['#c9848a', '#7aab8a', '#c4aa6a', '#a888c9', '#7ea8c4'];
  var HOLIDAY_COLOR = '#8f8378';

  /* ------------ storage ------------ */
  function readLS(k, f) { try { var r = localStorage.getItem(k); return r ? JSON.parse(r) : f; } catch (e) { return f; } }
  function writeLS(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  /* ------------ state ------------ */
  var S = {
    view: 'day',
    cursor: new Date(),
    now: new Date(),
    tasks: readLS('tasks_v2', null),
    localEvents: readLS('local_events_v3', []),
    gcal: {},
    apiKey: (function () { try { return localStorage.getItem(API_KEY_LS) || ''; } catch (e) { return ''; } })(),
    apiKeyDraft: '',
    syncState: 'idle',
    settingsOpen: false,
    modalOpen: false,
    modalTab: 'task',
    quickText: '',
    quickCat: 'To-do',
    draftTitle: '',
    draftDate: '',
    draftTime: '',
    draftRepeat: 'none',
    accent: (function () { try { return localStorage.getItem('cozy_accent') || '#c9848a'; } catch (e) { return '#c9848a'; } })(),
    showHolidays: true,
    weekStart: 0,
    editMode: false,
    hidden: readLS('hidden_events_v1', [])
  };
  S.apiKeyDraft = S.apiKey;
  var prefs = readLS('cozy_prefs', {});
  S.showHolidays = prefs.showHolidays !== false;
  S.weekStart = prefs.weekStart === 1 ? 1 : 0;
  if (!S.tasks || !S.tasks.length) {
    S.tasks = [
      { id: 't1', text: 'Water the pothos', cat: 'To-do', done: false },
      { id: 't2', text: 'Oat milk, lemons, rye bread', cat: 'Grocery', done: false },
      { id: 't3', text: 'Sketch a slower morning routine', cat: 'Idea', done: false },
      { id: 't4', text: 'Read 20 pages a night', cat: 'Goal', done: true }
    ];
    writeLS('tasks_v2', S.tasks);
  }

  /* ------------ date helpers ------------ */
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function dayKey(d) { return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function addDays(d, n) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; }
  function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
  function startOfWeek(d) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() - S.weekStart + 7) % 7)); return x; }
  function nthDow(y, m, dow, n) { var f = new Date(y, m, 1); return new Date(y, m, 1 + ((dow - f.getDay() + 7) % 7) + (n - 1) * 7); }
  function lastDow(y, m, dow) { var l = new Date(y, m + 1, 0); return new Date(y, m, l.getDate() - ((l.getDay() - dow + 7) % 7)); }
  function isoDate(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  /* ------------ holidays ------------ */
  var HOL_CACHE = {};
  function easter(year) {
    var a = year % 19, b = Math.floor(year / 100), c = year % 100;
    var d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
    var g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
    var i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
    var m = Math.floor((a + 11 * h + 22 * l) / 451);
    var month = Math.floor((h + l - 7 * m + 114) / 31);
    var day = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(year, month - 1, day);
  }
  function holidayMap(year) {
    if (HOL_CACHE[year]) return HOL_CACHE[year];
    var E = easter(year), map = {};
    function put(date, name) { var k = dayKey(date); (map[k] = map[k] || []).push(name); }
    function off(n) { return addDays(E, n); }
    put(new Date(year, 0, 1), "New Year's Day");
    put(new Date(year, 0, 6), 'Epiphany');
    put(nthDow(year, 0, 1, 3), 'Martin Luther King Jr. Day');
    put(nthDow(year, 1, 1, 3), "Presidents' Day");
    put(new Date(year, 1, 14), "Valentine's Day");
    put(off(-46), 'Ash Wednesday');
    put(off(-7), 'Palm Sunday');
    put(off(-2), 'Good Friday');
    put(off(-1), 'Holy Saturday');
    put(E, 'Easter Sunday');
    put(off(1), 'Easter Monday');
    put(nthDow(year, 4, 0, 2), "Mother's Day");
    put(lastDow(year, 4, 1), 'Memorial Day');
    put(off(49), 'Pentecost');
    put(nthDow(year, 5, 0, 3), "Father's Day");
    put(new Date(year, 5, 19), 'Juneteenth');
    put(new Date(year, 6, 4), 'Independence Day');
    put(nthDow(year, 8, 1, 1), 'Labor Day');
    put(nthDow(year, 9, 1, 2), 'Columbus Day');
    put(new Date(year, 9, 31), 'Halloween');
    put(new Date(year, 10, 1), "All Saints' Day");
    put(new Date(year, 10, 11), 'Veterans Day');
    put(nthDow(year, 10, 4, 4), 'Thanksgiving');
    put(new Date(year, 11, 24), 'Christmas Eve');
    put(new Date(year, 11, 25), 'Christmas Day');
    put(new Date(year, 11, 31), "New Year's Eve");
    HOL_CACHE[year] = map;
    return map;
  }

  /* ------------ google calendar (JSONP) ------------ */
  function fetchCalendarJSONP(calId, color, priority, timeMin, timeMax) {
    return new Promise(function (resolve) {
      var cbName = 'gcal_cb_' + Math.random().toString(36).slice(2);
      var url = 'https://www.googleapis.com/calendar/v3/calendars/' + encodeURIComponent(calId) + '/events'
        + '?key=' + S.apiKey + '&timeMin=' + encodeURIComponent(timeMin) + '&timeMax=' + encodeURIComponent(timeMax)
        + '&singleEvents=true&orderBy=startTime&maxResults=50&callback=' + cbName;
      var script = document.createElement('script');
      var timeout = setTimeout(function () {
        window[cbName] = null;
        if (script.parentNode) script.parentNode.removeChild(script);
        resolve([]);
      }, 8000);
      window[cbName] = function (data) {
        clearTimeout(timeout);
        window[cbName] = null;
        if (script.parentNode) script.parentNode.removeChild(script);
        resolve(((data && data.items) ? data.items : []).map(function (item) {
          item._color = color; item._calPriority = priority; return item;
        }));
      };
      script.src = url;
      script.onerror = function () { clearTimeout(timeout); window[cbName] = null; resolve([]); };
      document.head.appendChild(script);
    });
  }

  function normalizeGoogle(item) {
    var s = item.start || {};
    if (!s.date && !s.dateTime) return null;
    var allDay = !!s.date, d;
    if (allDay) { var p = s.date.split('-'); d = new Date(+p[0], +p[1] - 1, +p[2]); }
    else d = new Date(s.dateTime);
    return {
      id: item.id || (item.summary + (s.date || s.dateTime)),
      title: item.summary || 'Untitled',
      allDay: allDay,
      startTime: allDay ? '' : pad(d.getHours()) + ':' + pad(d.getMinutes()),
      sort: allDay ? -1 : d.getHours() * 60 + d.getMinutes(),
      color: item._color || '#7ea8c4',
      priority: item._calPriority == null ? 3 : item._calPriority,
      source: 'google',
      dayKey: dayKey(d)
    };
  }

  function hydrateCache() {
    var base = new Date();
    for (var i = -35; i <= 45; i++) {
      var k = dayKey(addDays(base, i));
      var c = readLS('cal_' + k, null);
      if (c) S.gcal[k] = c;
    }
  }

  function syncRange() {
    if (!S.apiKey) { S.syncState = 'mock'; render(); return; }
    var c = S.cursor;
    var from = addDays(new Date(c.getFullYear(), c.getMonth(), 1), -10);
    var to = addDays(new Date(c.getFullYear(), c.getMonth() + 1, 0), 12);
    S.syncState = 'syncing'; render();
    Promise.all(CALENDARS.map(function (cal) {
      return fetchCalendarJSONP(cal.id, cal.color, cal.priority, from.toISOString(), to.toISOString());
    })).then(function (batches) {
      var touched = {};
      batches.forEach(function (items) {
        items.forEach(function (item) {
          var ev = normalizeGoogle(item);
          if (!ev) return;
          var k = ev.dayKey;
          if (!touched[k]) { touched[k] = true; S.gcal[k] = (S.gcal[k] || []).filter(function (e) { return e.source !== 'google'; }); }
          S.gcal[k] = (S.gcal[k] || []).concat(ev);
        });
      });
      Object.keys(touched).forEach(function (k) { writeLS('cal_' + k, S.gcal[k]); });
      S.syncState = 'synced';
      render();
    });
  }

  /* ------------ events ------------ */
  function mockFor(date) {
    var today = new Date();
    var off = Math.round((new Date(date.getFullYear(), date.getMonth(), date.getDate()) - new Date(today.getFullYear(), today.getMonth(), today.getDate())) / 86400000);
    var table = {
      '0': [
        { title: 'Slow morning + coffee', t: '08:30', c: '#c9848a', p: 1 },
        { title: 'Design review', t: '11:00', c: '#7ea8c4', p: 2 },
        { title: 'Grocery run', t: '17:15', c: '#7aab8a', p: 2 },
        { title: 'Dinner with Zach', t: '19:30', c: '#c4aa6a', p: 2 }
      ],
      '1': [{ title: 'Dentist', t: '09:45', c: '#7ea8c4', p: 2 }, { title: 'Library books due', t: '', c: '#a888c9', p: 3 }],
      '2': [{ title: 'Yoga', t: '07:00', c: '#7aab8a', p: 1 }, { title: 'Team sync', t: '14:00', c: '#7ea8c4', p: 2 }],
      '3': [{ title: 'Family dinner', t: '18:00', c: '#c4aa6a', p: 2 }],
      '4': [{ title: 'Farmers market', t: '10:00', c: '#7aab8a', p: 1 }],
      '5': [{ title: 'Weekend trip', t: '', c: '#a888c9', p: 2 }],
      '-1': [{ title: 'Pay rent', t: '', c: '#c9848a', p: 1 }]
    };
    return (table[String(off)] || []).map(function (r, i) {
      return {
        id: 'mock-' + off + '-' + i, title: r.title, allDay: !r.t, startTime: r.t,
        sort: r.t ? (+r.t.slice(0, 2)) * 60 + (+r.t.slice(3)) : -1,
        color: r.c, priority: r.p, source: 'mock', dayKey: dayKey(date)
      };
    });
  }

  function localFor(date) {
    var key = dayKey(date), out = [];
    (S.localEvents || []).forEach(function (ev) {
      if ((ev.exceptions || []).indexOf(key) !== -1) return;
      var p = String(ev.date || '').split('-');
      if (p.length !== 3) return;
      var base = new Date(+p[0], +p[1] - 1, +p[2]);
      if (date < new Date(base.getFullYear(), base.getMonth(), base.getDate())) return;
      var rep = ev.repeat || 'none', hit = false;
      if (rep === 'none') hit = sameDay(base, date);
      else if (rep === 'daily') hit = true;
      else if (rep === 'weekly') hit = base.getDay() === date.getDay();
      else if (rep === 'monthly') hit = base.getDate() === date.getDate();
      if (!hit) return;
      out.push({
        id: ev.id + '-' + key, title: ev.title, allDay: !ev.time, startTime: ev.time || '',
        sort: ev.time ? (+ev.time.slice(0, 2)) * 60 + (+ev.time.slice(3)) : -1,
        color: ev.color || S.accent, priority: 1, source: 'local', dayKey: key
      });
    });
    return out;
  }

  function evKey(e) { return e.source + '|' + (e.title || '') + '|' + e.dayKey + '|' + (e.startTime || ''); }
  function isHidden(e) { return S.hidden.indexOf(evKey(e)) !== -1; }
  function hideEvent(k) { if (S.hidden.indexOf(k) === -1) { S.hidden = S.hidden.concat(k); writeLS('hidden_events_v1', S.hidden); } }

  function eventsFor(date) {
    var key = dayKey(date), list = [];
    if (S.showHolidays) {
      (holidayMap(date.getFullYear())[key] || []).forEach(function (n, i) {
        list.push({ id: 'hol-' + key + '-' + i, title: n, allDay: true, startTime: '', sort: -1, color: HOLIDAY_COLOR, priority: 0, source: 'holiday', dayKey: key });
      });
    }
    var g = S.gcal[key];
    if (g && g.length) list = list.concat(g);
    else if (!S.apiKey) list = list.concat(mockFor(date));
    list = list.concat(localFor(date));
    var seen = {};
    list = list.filter(function (e) {
      var k = (e.title || '').toLowerCase() + '|' + e.startTime;
      if (seen[k]) return false; seen[k] = true; return true;
    });
    if (!S.editMode) list = list.filter(function (e) { return !isHidden(e); });
    list.sort(function (a, b) {
      if (a.allDay !== b.allDay) return a.allDay ? -1 : 1;
      if (a.allDay) return a.priority - b.priority;
      return a.sort - b.sort;
    });
    return list;
  }

  function timeLabel(e) { return e.allDay ? 'All day' : e.startTime; }
  function sourceLabel(e) {
    return e.source === 'holiday' ? 'Holiday' : e.source === 'local' ? 'Local' : e.source === 'mock' ? 'Sample' : 'Calendar';
  }

  /* ------------ actions ------------ */
  function saveTasks() { writeLS('tasks_v2', S.tasks); }
  function saveLocal() { writeLS('local_events_v3', S.localEvents); }
  function savePrefs() { writeLS('cozy_prefs', { showHolidays: S.showHolidays, weekStart: S.weekStart }); }
  function addTask(text, cat) {
    if (!text || !text.trim()) return;
    S.tasks = S.tasks.concat({ id: 'k' + Date.now(), text: text.trim(), cat: cat, done: false });
    saveTasks();
  }
  function shift(n) {
    var before = S.cursor.getMonth() + '-' + S.cursor.getFullYear();
    S.cursor = S.view === 'month'
      ? new Date(S.cursor.getFullYear(), S.cursor.getMonth() + n, 1)
      : addDays(S.cursor, S.view === 'week' ? 7 * n : n);
    if (before !== (S.cursor.getMonth() + '-' + S.cursor.getFullYear())) syncRange();
  }

  /* ------------ views ------------ */
  function chipStyle(active, color) {
    return 'padding: 7px 14px; border-radius: 999px; cursor: pointer; font-size: 12.5px; transition: all 150ms ease; border: 1px solid '
      + (active ? color : '#363636') + '; background: ' + (active ? color : '#252525') + '; color: ' + (active ? '#141414' : '#b4b4b4') + '; font-weight: ' + (active ? '600' : '400') + ';';
  }

  function header() {
    var now = S.now, cur = S.cursor, a = S.accent;
    var weekBase = startOfWeek(cur);
    var rangeLabel = S.view === 'day'
      ? cur.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' })
      : S.view === 'week'
        ? weekBase.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' – ' + addDays(weekBase, 6).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })
        : cur.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    var sync = S.syncState === 'syncing' ? 'Syncing calendars…' : S.syncState === 'synced' ? 'Calendars synced' : S.apiKey ? 'Idle' : 'Sample data — add API key';
    var tabs = ['day', 'week', 'month'].map(function (v) {
      var on = S.view === v;
      return '<button data-act="view" data-v="' + v + '" style="padding: 7px 20px; border-radius: 999px; border: none; cursor: pointer; font-size: 13px; letter-spacing: 0.03em; transition: background 160ms ease, color 160ms ease; '
        + (on ? 'background: ' + a + '; color: #141414; font-weight: 600;' : 'background: transparent; color: #b4b4b4;') + '">' + v.charAt(0).toUpperCase() + v.slice(1) + '</button>';
    }).join('');
    var navBtn = 'border-radius: 999px; background: #1f1f1f; border: 1px solid #2c2c2c; color: #d6d6d6; cursor: pointer;';
    var cap = S.view === 'day' ? 1080 : 1500;
    return '<header style="border-bottom: 1px solid #262626;"><div style="max-width: ' + cap + 'px; margin: 0 auto; display: flex; align-items: center; gap: 20px; padding: 16px 24px 14px;">'
      + '<div style="display: flex; align-items: baseline; gap: 14px; min-width: 300px;">'
      + '<div style="font-family: Newsreader, serif; font-size: 40px; line-height: 1; color: #f4f4f4;">' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + '</div>'
      + '<div style="display: flex; flex-direction: column; gap: 2px;">'
      + '<div style="font-size: 13px; color: #b4b4b4;">' + esc(now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })) + '</div>'
      + '<div style="font-size: 11px; color: #909090; letter-spacing: 0.08em; text-transform: uppercase;">' + esc(sync) + '</div>'
      + '</div></div>'
      + '<div style="display: flex; gap: 6px; padding: 4px; background: #1f1f1f; border: 1px solid #2c2c2c; border-radius: 999px;">' + tabs + '</div>'
      + '<div style="display: flex; align-items: center; gap: 8px;">'
      + '<button class="ghost" data-act="prev" style="width: 34px; height: 34px; font-size: 15px; ' + navBtn + '">‹</button>'
      + '<button class="ghost" data-act="today" style="height: 34px; padding: 0 16px; font-size: 13px; ' + navBtn + '">Today</button>'
      + '<button class="ghost" data-act="next" style="width: 34px; height: 34px; font-size: 15px; ' + navBtn + '">›</button>'
      + '</div>'
      + '<div style="flex: 1; min-width: 0;"></div>'
      + '<div style="font-family: Newsreader, serif; font-size: 19px; color: #d6d6d6; white-space: nowrap; margin-right: 4px;">' + esc(rangeLabel) + '</div>'
      + '<button class="ghost" data-act="edit" title="Hide events" style="height: 36px; padding: 0 15px; font-size: 12.5px; ' + navBtn
      + (S.editMode ? ' background: #ededed; color: #141414;' : '') + '">' + (S.editMode ? 'Done' : 'Edit') + '</button>'
      + '<button class="ghost" data-act="settings" style="width: 36px; height: 36px; font-size: 15px; ' + navBtn + '">✳</button>'
      + '</div></header>';
  }

  function eventPill(e) {
    return '<div class="pill" style="display: flex; align-items: center; gap: 14px; padding: 13px 18px; border-radius: 16px; background: ' + e.color + 'd9; border: none; opacity: ' + (S.editMode && isHidden(e) ? 0.4 : 1) + '; animation: cozyIn 260ms ease both;">'
      + '<span style="min-width: 68px; font-size: 13px; font-variant-numeric: tabular-nums; color: rgba(15,15,15,0.75);">' + esc(timeLabel(e)) + '</span>'
      + '<div style="flex: 1; min-width: 0; font-size: 15.5px; font-weight: 600; color: #101010; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">' + esc(e.title) + '</div>'
      + (S.editMode
        ? '<button data-act="hide" data-k="' + esc(evKey(e)) + '" title="Hide" style="border: none; background: #ffffff40; color: #141414; width: 22px; height: 22px; border-radius: 999px; cursor: pointer; font-size: 13px; line-height: 1; padding: 0;">' + (isHidden(e) ? '+' : '×') + '</button>'
        : '<div style="font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; color: #141414; background: #ffffff33; border: none;">' + sourceLabel(e) + '</div>')
      + '</div>';
  }

  function taskRow(t, color) {
    var tick = '<svg viewBox="0 0 12 12" fill="none" style="display: block; width: 14px; height: 14px; transform: scale(' + (t.done ? 1 : 0.5) + '); opacity: ' + (t.done ? 1 : 0) + '; transition: transform 180ms cubic-bezier(0.34,1.56,0.64,1), opacity 140ms ease;">'
      + '<polyline points="2,6 5,9 10,3" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></polyline></svg>';
    return '<div class="taskrow" style="display: flex; align-items: center; gap: 11px; padding: 10px 13px; border-radius: 16px; background: #1b1b1b; border: none;">'
      + '<button data-act="toggle" data-id="' + t.id + '" style="width: 22px; height: 22px; flex: none; border-radius: 7px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; transition: background 160ms ease, border-color 160ms ease; border: 2px solid ' + (t.done ? color : '#454545') + '; background: ' + (t.done ? color : 'transparent') + ';">' + tick + '</button>'
      + '<span style="font-size: 14.5px; line-height: 1.45; ' + (t.done ? 'color: #8a8a8a; text-decoration: line-through;' : 'color: #e2e2e2;') + '">' + esc(t.text) + '</span>'
      + '<button class="del" data-act="del" data-id="' + t.id + '" style="margin-left: auto;">×</button>'
      + '</div>';
  }

  function dayView() {
    var cur = S.cursor, a = S.accent, now = S.now;
    var evs = eventsFor(cur);
    var timed = evs.filter(function (e) { return !e.allDay; }).length;
    var open = S.tasks.filter(function (t) { return !t.done; }).length;
    var hour = now.getHours();
    var greeting = (hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening') + (sameDay(cur, now) ? '' : ' — looking ahead');
    var summary = evs.length
      ? evs.length + (evs.length === 1 ? ' thing' : ' things') + ' on the calendar, ' + timed + ' at a set time. ' + open + ' task' + (open === 1 ? '' : 's') + ' still open.'
      : 'No events on this day. ' + open + ' task' + (open === 1 ? '' : 's') + ' waiting whenever you want them.';
    var stats = [[evs.length + ' events', a], [timed + ' timed', '#7ea8c4'], [open + ' open tasks', '#7aab8a']].map(function (s) {
      return '<div style="display: flex; align-items: center; gap: 9px; padding: 7px 14px; border-radius: 999px; background: #1b1b1b; border: none;">'
        + '<span style="width: 10px; height: 10px; border-radius: 3px; background: ' + s[1] + ';"></span>'
        + '<span style="font-size: 13px; color: #d6d6d6;">' + esc(s[0]) + '</span></div>';
    }).join('');
    var agenda = evs.length ? evs.map(eventPill).join('')
      : '<div style="padding: 34px 0 30px; text-align: center; color: #909090; font-size: 14px;">Nothing scheduled. A rare and beautiful thing.</div>';
    var chips = CATS.map(function (c) {
      return '<button data-act="cat" data-v="' + c.name + '" style="' + chipStyle(S.quickCat === c.name, c.color) + '">' + c.name + '</button>';
    }).join('');
    var quads = CATS.filter(function (c) {
      return S.tasks.some(function (t) { return t.cat === c.name; });
    }).map(function (c) {
      var list = S.tasks.filter(function (t) { return t.cat === c.name; });
      var rows = list.map(function (t) { return taskRow(t, c.color); }).join('');
      return '<div style="padding: 15px 18px 16px; border-radius: 24px; background: #1f1f1f; border: none;">'
        + '<div style="display: flex; align-items: center; gap: 9px; margin-bottom: 12px;">'
        + '<span style="width: 10px; height: 10px; border-radius: 3px; background: ' + c.color + ';"></span>'
        + '<span style="font-size: 12px; letter-spacing: 0.11em; text-transform: uppercase; color: #d6d6d6;">' + c.name + '</span>'
        + '<span style="margin-left: auto; font-size: 11px; color: #909090;">' + list.filter(function (t) { return !t.done; }).length + '/' + list.length + '</span></div>'
        + '<div style="display: flex; flex-direction: column; gap: 7px;">' + rows + '</div></div>';
    }).join('');

    return '<div style="display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(300px, 1fr); gap: 18px; align-items: start;">'
      + '<div style="display: flex; flex-direction: column; gap: 14px;">'
      + '<div style="padding: 22px 26px; border-radius: 26px; background: #222222; border: none;">'
      + '<div style="font-family: Newsreader, serif; font-size: 29px; color: #f4f4f4;">' + esc(greeting) + '</div>'
      + '<div style="margin-top: 8px; font-size: 14px; color: #b4b4b4; line-height: 1.6; max-width: 46ch; text-wrap: pretty;">' + esc(summary) + '</div>'
      + '<div style="margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap;">' + stats + '</div></div>'
      + '<div style="padding: 18px 20px 20px; border-radius: 26px; background: #1f1f1f; border: none;">'
      + '<div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px;">'
      + '<div style="font-family: Newsreader, serif; font-size: 20px; color: #ededed;">Agenda</div>'
      + '<div style="font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #909090;">' + esc(cur.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })) + '</div></div>'
      + '<div style="display: flex; flex-direction: column; gap: 9px;">' + agenda + '</div></div></div>'
      + '<div style="display: flex; flex-direction: column; gap: 14px;">'
      + '<div style="padding: 18px 20px; border-radius: 26px; background: #1f1f1f; border: none;">'
      + '<div style="font-family: Newsreader, serif; font-size: 20px; color: #ededed; margin-bottom: 14px;">Quick add</div>'
      + '<input id="quickInput" value="' + esc(S.quickText) + '" placeholder="What needs doing?" style="width: 100%; padding: 12px 15px; border-radius: 14px; background: #121212; border: 1px solid #303030; color: #ededed; font-size: 14px;" />'
      + '<div style="margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap;">' + chips + '</div></div>'
      + quads + '</div></div>';
  }

  function weekView() {
    var a = S.accent, base = startOfWeek(S.cursor), out = '';
    for (var i = 0; i < 7; i++) {
      var d = addDays(base, i);
      var today = sameDay(d, S.now), sel = sameDay(d, S.cursor);
      var evs = eventsFor(d);
      var body = evs.length ? evs.map(function (e) {
        return '<div class="pill" ' + (S.editMode ? 'data-act="hide" data-k="' + esc(evKey(e)) + '" ' : '') + 'style="display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 12px; background: ' + e.color + 'd9; border: none; cursor: ' + (S.editMode ? 'pointer' : 'default') + '; opacity: ' + (S.editMode && isHidden(e) ? 0.4 : 1) + ';">'
          + '<div style="font-size: 11px; color: rgba(15,15,15,0.75); font-variant-numeric: tabular-nums;">' + esc(timeLabel(e)) + '</div>'
          + '<div style="font-size: 13px; line-height: 1.4; font-weight: 500; color: #141414; text-wrap: pretty;">' + esc(e.title) + '</div></div>';
      }).join('') : '<div style="font-size: 12px; color: ' + (today ? '#8a8a8a' : '#5f5f5f') + '; padding: 4px 2px;">—</div>';
      out += '<div style="border-radius: 22px; background: ' + (today ? '#e8e8e8' : sel ? '#2b2b2b' : '#212121') + '; border: none; overflow: hidden;">'
        + '<button data-act="goday" data-d="' + isoDate(d) + '" style="width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 5px; padding: 14px 14px 12px; background: transparent; border: none; cursor: pointer; text-align: left;">'
        + '<span style="font-size: 11.5px; letter-spacing: 0.14em; text-transform: uppercase; color: ' + (today ? '#3a3a3a' : '#b4b4b4') + ';">' + esc(d.toLocaleDateString(undefined, { weekday: 'short' })) + '</span>'
        + '<span style="font-family: Newsreader, serif; font-size: ' + (today ? '30px' : '27px') + '; line-height: 1; font-weight: ' + (today ? '600' : '400') + '; color: ' + (today ? '#111111' : '#ededed') + ';">' + d.getDate() + '</span></button>'
        + '<div style="display: flex; flex-direction: column; gap: 7px; padding: 12px 10px 14px; min-height: 180px;">' + body + '</div></div>';
    }
    return '<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 12px; align-items: start;">' + out + '</div>';
  }

  function monthView() {
    var a = S.accent, cur = S.cursor;
    var gridStart = startOfWeek(new Date(cur.getFullYear(), cur.getMonth(), 1));
    var head = '';
    for (var h = 0; h < 7; h++) {
      head += '<div style="text-align: center; font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: #909090;">'
        + esc(addDays(gridStart, h).toLocaleDateString(undefined, { weekday: 'short' })) + '</div>';
    }
    var cells = '';
    for (var i = 0; i < 42; i++) {
      var d = addDays(gridStart, i);
      if (i >= 35 && d.getMonth() !== cur.getMonth()) continue;
      var inMonth = d.getMonth() === cur.getMonth(), today = sameDay(d, S.now);
      var evs = eventsFor(d);
      var previews = evs.slice(0, 3).map(function (e) {
        return '<div ' + (S.editMode ? 'data-act="hide" data-k="' + esc(evKey(e)) + '" ' : '') + 'style="display: flex; flex-direction: column; gap: 1px; padding: 4px 8px; border-radius: 8px; background: ' + e.color + 'd9; cursor: ' + (S.editMode ? 'pointer' : 'default') + '; opacity: ' + (S.editMode && isHidden(e) ? 0.4 : 1) + ';">'
          + (e.allDay ? '' : '<span style="font-size: 11px; color: rgba(15,15,15,0.75); font-variant-numeric: tabular-nums;">' + esc(e.startTime) + '</span>')
          + '<span style="font-size: 12px; font-weight: 600; color: #101010; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">' + esc(e.title) + '</span></div>';
      }).join('');
      var dots = evs.length > 3 ? '<span style="font-size: 11px; color: ' + (today ? '#3a3a3a' : '#b4b4b4') + ';">+' + (evs.length - 3) + ' more</span>' : '';
      cells += '<button class="cell" data-act="goday" data-d="' + isoDate(d) + '" style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-height: 132px; padding: 9px; border-radius: 16px; cursor: pointer; text-align: left; background: ' + (today ? '#e8e8e8' : inMonth ? '#212121' : '#1a1a1a') + '; border: none; opacity: ' + (inMonth ? 1 : 0.55) + ';">'
        + '<span style="font-family: Newsreader, serif; font-size: ' + (today ? '22px' : '18px') + '; font-weight: ' + (today ? '600' : '400') + '; color: ' + (today ? '#111111' : '#d4d4d4') + ';">' + d.getDate() + '</span>'
        + '<div style="display: flex; flex-direction: column; gap: 4px; width: 100%;">' + previews + '</div>'
        + '<div style="margin-top: auto; display: flex; gap: 4px;">' + dots + '</div></button>';
    }
    return '<div style="border-radius: 26px; background: #1d1d1d; border: none; padding: 18px; animation: cozyFade 220ms ease both;">'
      + '<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; margin-bottom: 10px;">' + head + '</div>'
      + '<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px;">' + cells + '</div></div>';
  }

  function modal() {
    if (!S.modalOpen) return '';
    var a = S.accent;
    var tabs = [['Task', 'task'], ['Event', 'event']].map(function (m) {
      var on = S.modalTab === m[1];
      return '<button data-act="mtab" data-v="' + m[1] + '" style="flex: 1; padding: 8px 16px; border-radius: 999px; border: none; cursor: pointer; font-size: 13px; '
        + (on ? 'background: ' + a + '; color: #141414; font-weight: 600;' : 'background: transparent; color: #b4b4b4;') + '">' + m[0] + '</button>';
    }).join('');
    var inputStyle = 'width: 100%; padding: 12px 15px; border-radius: 14px; background: #121212; border: 1px solid #303030; color: #ededed; font-size: 14px;';
    var body;
    if (S.modalTab === 'task') {
      body = '<div style="display: flex; flex-direction: column; gap: 12px;">'
        + '<input id="mTaskInput" value="' + esc(S.quickText) + '" placeholder="Task title" style="' + inputStyle + '" />'
        + '<div style="display: flex; gap: 8px; flex-wrap: wrap;">'
        + CATS.map(function (c) { return '<button data-act="cat" data-v="' + c.name + '" style="' + chipStyle(S.quickCat === c.name, c.color) + '">' + c.name + '</button>'; }).join('')
        + '</div></div>';
    } else {
      body = '<div style="display: flex; flex-direction: column; gap: 12px;">'
        + '<input id="mTitle" value="' + esc(S.draftTitle) + '" placeholder="Event title" style="' + inputStyle + '" />'
        + '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">'
        + '<input id="mDate" type="date" value="' + esc(S.draftDate || isoDate(S.cursor)) + '" style="' + inputStyle + ' color-scheme: dark;" />'
        + '<input id="mTime" type="time" value="' + esc(S.draftTime) + '" style="' + inputStyle + ' color-scheme: dark;" /></div>'
        + '<div style="display: flex; gap: 8px; flex-wrap: wrap;">'
        + ['none', 'daily', 'weekly', 'monthly'].map(function (r) {
          return '<button data-act="rep" data-v="' + r + '" style="' + chipStyle(S.draftRepeat === r, a) + '">' + (r === 'none' ? 'Once' : r.charAt(0).toUpperCase() + r.slice(1)) + '</button>';
        }).join('') + '</div></div>';
    }
    return '<div data-act="backdrop" style="position: fixed; inset: 0; background: rgba(12,10,9,0.62); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; z-index: 40; animation: cozyFade 160ms ease both;">'
      + '<div data-stop="1" style="width: 460px; max-width: 92vw; padding: 26px 28px 24px; border-radius: 26px; background: #1f1f1f; border: 1px solid #333333; box-shadow: 0 30px 70px rgba(0,0,0,0.5); animation: cozyIn 200ms ease both;">'
      + '<div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;">'
      + '<div style="font-family: Newsreader, serif; font-size: 22px; color: #f4f4f4;">Add something</div>'
      + '<button class="del" data-act="closeModal" style="font-size: 18px;">×</button></div>'
      + '<div style="display: flex; gap: 6px; padding: 4px; background: #121212; border: 1px solid #2c2c2c; border-radius: 999px; margin-bottom: 18px;">' + tabs + '</div>'
      + body
      + '<div style="display: flex; gap: 10px; margin-top: 22px;">'
      + '<button data-act="closeModal" style="flex: 1; padding: 12px; border-radius: 14px; background: #121212; border: 1px solid #303030; color: #b4b4b4; cursor: pointer; font-size: 14px;">Cancel</button>'
      + '<button data-act="save" style="flex: 1.4; padding: 12px; border-radius: 14px; background: ' + a + '; border: none; color: #141414; cursor: pointer; font-size: 14px; font-weight: 600;">Save</button>'
      + '</div></div></div>';
  }

  function settings() {
    if (!S.settingsOpen) return '';
    var a = S.accent;
    var calRows = CALENDARS.map(function (c) {
      var count = 0;
      Object.keys(S.gcal).forEach(function (k) { (S.gcal[k] || []).forEach(function (e) { if (e.color === c.color) count++; }); });
      var name = c.id.indexOf('group.calendar') !== -1 ? 'Family calendar' : c.id;
      return '<div style="display: flex; align-items: center; gap: 11px; padding: 10px 13px; border-radius: 14px; background: #1b1b1b; border: none;">'
        + '<span style="width: 11px; height: 11px; border-radius: 3px; flex: none; background: ' + c.color + ';"></span>'
        + '<span style="flex: 1; min-width: 0; font-size: 13px; color: #c8c8c8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">' + esc(name) + '</span>'
        + '<span style="font-size: 10.5px; color: #909090;">' + (count ? count + ' events' : (S.apiKey ? '—' : 'sample')) + '</span></div>';
    }).join('');
    var swatches = ACCENTS.map(function (c) {
      return '<button data-act="accent" data-v="' + c + '" style="width: 34px; height: 34px; border-radius: 999px; cursor: pointer; background: ' + c + '; border: 2px solid ' + (a === c ? '#ededed' : 'transparent') + ';"></button>';
    }).join('');
    return '<div style="position: fixed; top: 0; right: 0; bottom: 0; width: 380px; background: #1e1e1e; border-left: 1px solid #2c2c2c; box-shadow: -20px 0 60px rgba(0,0,0,0.45); z-index: 50; padding: 26px 26px 30px; overflow: auto; animation: cozyIn 200ms ease both;">'
      + '<div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px;">'
      + '<div style="font-family: Newsreader, serif; font-size: 22px; color: #f4f4f4;">Settings</div>'
      + '<button class="del" data-act="settings" style="font-size: 18px;">×</button></div>'
      + '<div style="font-size: 11px; letter-spacing: 0.13em; text-transform: uppercase; color: #909090; margin-bottom: 10px;">Google Calendar API key</div>'
      + '<input id="apiInput" value="' + esc(S.apiKeyDraft) + '" placeholder="AIza…" style="width: 100%; padding: 11px 14px; border-radius: 13px; background: #121212; border: 1px solid #303030; color: #ededed; font-size: 13px;" />'
      + '<div style="margin-top: 9px; display: flex; gap: 8px;">'
      + '<button data-act="saveKey" style="flex: 1; padding: 10px; border-radius: 12px; background: #7aab8a; border: none; color: #141414; font-size: 13px; font-weight: 600; cursor: pointer;">Save &amp; sync</button>'
      + '<button data-act="refresh" style="flex: 1; padding: 10px; border-radius: 12px; background: #1f1f1f; border: 1px solid #303030; color: #d6d6d6; font-size: 13px; cursor: pointer;">Refresh</button></div>'
      + '<div style="margin-top: 9px; font-size: 13px; color: #909090; line-height: 1.55;">'
      + (S.apiKey ? 'Key saved locally. Calendars are fetched client-side with JSONP — no OAuth, no server.' : 'Without a key the planner shows sample events. Paste a Google Calendar API key to pull the four real calendars.')
      + '</div>'
      + '<div style="height: 1px; background: #2a2a2a; margin: 24px 0;"></div>'
      + '<div style="font-size: 11px; letter-spacing: 0.13em; text-transform: uppercase; color: #909090; margin-bottom: 12px;">Calendars</div>'
      + '<div style="display: flex; flex-direction: column; gap: 9px;">' + calRows + '</div>'
      + '<div style="height: 1px; background: #2a2a2a; margin: 24px 0;"></div>'
      + '<div style="font-size: 11px; letter-spacing: 0.13em; text-transform: uppercase; color: #909090; margin-bottom: 12px;">Accent</div>'
      + '<div style="display: flex; gap: 10px; flex-wrap: wrap;">' + swatches + '</div>'
      + '<div style="height: 1px; background: #2a2a2a; margin: 24px 0;"></div>'
      + '<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">'
      + '<div style="font-size: 13px; color: #c8c8c8;">Show holidays</div>'
      + '<button data-act="holidays" style="padding: 7px 18px; border-radius: 999px; cursor: pointer; font-size: 12.5px; border: 1px solid ' + (S.showHolidays ? a : '#303030') + '; background: ' + (S.showHolidays ? a + '22' : '#1f1f1f') + '; color: ' + (S.showHolidays ? a : '#a2a2a2') + ';">' + (S.showHolidays ? 'On' : 'Off') + '</button></div>'
      + '<div style="margin-top: 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">'
      + '<div style="font-size: 13px; color: #c8c8c8;">Week starts</div>'
      + '<button data-act="weekstart" style="padding: 7px 15px; border-radius: 999px; background: #1f1f1f; border: 1px solid #303030; color: #d6d6d6; font-size: 12.5px; cursor: pointer;">' + (S.weekStart === 0 ? 'Sunday' : 'Monday') + '</button></div>'
      + '<div style="margin-top: 26px; font-size: 11.5px; color: #8a8a8a; line-height: 1.6;">Tasks, local events and calendar cache live in this browser\u2019s local storage.</div>'
      + '</div>';
  }

  /* ------------ render ------------ */
  function render() {
    var main = S.view === 'day' ? dayView() : S.view === 'week' ? weekView() : monthView();
    document.getElementById('app').innerHTML =
      '<div style="min-height: 100vh; padding: 18px; display: flex; align-items: flex-start;">'
      + '<div style="flex: 1; max-width: ' + (S.view === 'day' ? 1136 : 1556) + 'px; margin: 0 auto; display: flex; flex-direction: column; min-height: calc(100vh - 36px); background: #141414; border: 1px solid #303030; border-radius: 24px; overflow: hidden;">'
      + header()
      + (S.editMode ? '<div style="background: #1f1f1f;"><div style="max-width: ' + (S.view === 'day' ? 1080 : 1500) + 'px; margin: 0 auto; padding: 10px 28px; display: flex; align-items: center; gap: 14px; font-size: 13px; color: #c8c8c8;">'
          + '<span>Edit mode — click an event to hide it.</span>'
          + '<span style="color: #909090;">' + S.hidden.length + ' hidden</span>'
          + (S.hidden.length ? '<button data-act="unhideAll" style="margin-left: auto; padding: 6px 14px; border-radius: 999px; background: #2c2c2c; border: none; color: #d6d6d6; font-size: 12px; cursor: pointer;">Show all</button>' : '')
          + '</div></div>' : '')
      + '<main style="flex: 1; padding: 22px 24px 40px; overflow: auto;"><div style="max-width: ' + (S.view === 'day' ? 1080 : 1500) + 'px; width: 100%; margin: 0 auto;">' + main + '</div></main>'
      + '<button class="fab" data-act="openModal" style="position: fixed; right: 40px; bottom: 38px; width: 60px; height: 60px; border-radius: 999px; border: none; background: ' + S.accent + '; color: #141414; font-size: 28px; line-height: 1; cursor: pointer; ">+</button>'
      + '</div>' + modal() + settings() + '</div>';
  }

  /* ------------ events ------------ */
  function val(id) { var el = document.getElementById(id); return el ? el.value : ''; }

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'quickInput' || t.id === 'mTaskInput') S.quickText = t.value;
    else if (t.id === 'mTitle') S.draftTitle = t.value;
    else if (t.id === 'mDate') S.draftDate = t.value;
    else if (t.id === 'mTime') S.draftTime = t.value;
    else if (t.id === 'apiInput') S.apiKeyDraft = t.value;
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'quickInput') {
      addTask(S.quickText, S.quickCat); S.quickText = ''; render();
    }
    if (e.key === 'Escape') { S.modalOpen = false; S.settingsOpen = false; render(); }
  });

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act'), v = el.getAttribute('data-v');
    if (act === 'backdrop' && e.target !== el) return;
    switch (act) {
      case 'view': S.view = v; break;
      case 'prev': shift(-1); break;
      case 'next': shift(1); break;
      case 'today': S.cursor = new Date(); break;
      case 'settings': S.settingsOpen = !S.settingsOpen; break;
      case 'edit': S.editMode = !S.editMode; break;
      case 'hide':
        var k = el.getAttribute('data-k');
        if (S.hidden.indexOf(k) === -1) S.hidden = S.hidden.concat(k);
        else S.hidden = S.hidden.filter(function (x) { return x !== k; });
        writeLS('hidden_events_v1', S.hidden); break;
      case 'unhideAll': S.hidden = []; writeLS('hidden_events_v1', S.hidden); break;
      case 'goday': var p = el.getAttribute('data-d').split('-'); S.cursor = new Date(+p[0], +p[1] - 1, +p[2]); S.view = 'day'; break;
      case 'cat': S.quickCat = v; break;
      case 'toggle':
        S.tasks = S.tasks.map(function (t) { return t.id === el.getAttribute('data-id') ? Object.assign({}, t, { done: !t.done }) : t; });
        saveTasks(); break;
      case 'del':
        S.tasks = S.tasks.filter(function (t) { return t.id !== el.getAttribute('data-id'); });
        saveTasks(); break;
      case 'openModal': S.modalOpen = true; S.draftDate = isoDate(S.cursor); break;
      case 'closeModal': case 'backdrop': S.modalOpen = false; break;
      case 'mtab': S.modalTab = v; break;
      case 'rep': S.draftRepeat = v; break;
      case 'save':
        if (S.modalTab === 'task') { addTask(val('mTaskInput') || S.quickText, S.quickCat); S.quickText = ''; }
        else {
          var title = val('mTitle') || S.draftTitle;
          if (title.trim()) {
            S.localEvents = (S.localEvents || []).concat({
              id: 'le' + Date.now(), title: title.trim(),
              date: val('mDate') || S.draftDate || isoDate(S.cursor),
              time: val('mTime') || S.draftTime || '',
              repeat: S.draftRepeat, exceptions: [], color: S.accent
            });
            saveLocal();
          }
          S.draftTitle = ''; S.draftTime = ''; S.draftRepeat = 'none';
        }
        S.modalOpen = false; break;
      case 'accent': S.accent = v; try { localStorage.setItem('cozy_accent', v); } catch (err) {} break;
      case 'holidays': S.showHolidays = !S.showHolidays; savePrefs(); break;
      case 'weekstart': S.weekStart = S.weekStart === 0 ? 1 : 0; savePrefs(); break;
      case 'saveKey':
        S.apiKey = (val('apiInput') || S.apiKeyDraft).trim();
        S.apiKeyDraft = S.apiKey;
        try { localStorage.setItem(API_KEY_LS, S.apiKey); } catch (err) {}
        syncRange(); break;
      case 'refresh': syncRange(); break;
      default: return;
    }
    render();
  });

  hydrateCache();
  render();
  syncRange();
  setInterval(function () { S.now = new Date(); render(); }, 30000);
})();
</script>
</body>
</html>
