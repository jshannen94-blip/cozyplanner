<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Tasks · Cozy Planner</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0e0e0f" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@200;300;400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #0e0e0f; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: Karla, system-ui, -apple-system, sans-serif;
    font-weight: 300; font-size: 16px; color: #e8e6e3;
    -webkit-font-smoothing: antialiased; overscroll-behavior-y: contain;
  }
  button, input { font-family: inherit; font-weight: inherit; }
  input { -webkit-appearance: none; appearance: none; }
  input:focus { outline: none; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  .tap { transition: opacity 140ms ease; cursor: pointer; }
  .tap:active { opacity: 0.55; }
  .fade { animation: fade 240ms ease both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
<div id="app"></div>
<script src="store.js"></script>
<script>
(function () {
  'use strict';
  var K = window.Store;
  var MUTED = '#6b6864', DIM = '#4a4845', TEXT = '#e8e6e3', LINE = '#1f1f21';

  var S = { tasks: K.tasks(), cat: 'To-do', adding: false, showDone: true };

  function taskLine(t) {
    var color = (['#b08b90','#f0eee6','#779f7c','#78959b'].indexOf(K.prefs().accent) === -1 ? '#b08b90' : K.prefs().accent);
    return '<div class="fade" style="display: flex; align-items: center; gap: 16px; padding: 14px 2px; border-bottom: 1px solid ' + LINE + ';">'
      + '<button class="tap" data-act="toggle" data-id="' + t.id + '" style="width: 20px; height: 20px; flex: none; border-radius: 999px; display: flex; align-items: center; justify-content: center; padding: 0; transition: background 160ms ease, border-color 160ms ease; border: 1px solid ' + (t.done ? color : '#38363a') + '; background: ' + (t.done ? color : 'transparent') + ';">'
      + '<svg viewBox="0 0 12 12" fill="none" style="width: 11px; height: 11px; opacity: ' + (t.done ? 1 : 0) + ';"><polyline points="2,6 5,9 10,3" stroke="#0e0e0f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></polyline></svg></button>'
      + '<span style="flex: 1; font-size: 16.5px; line-height: 1.5; ' + (t.done ? 'color: ' + DIM + '; text-decoration: line-through;' : 'color: ' + TEXT + ';') + '">' + K.esc(t.text) + '</span>'
      + '<button class="tap" data-act="del" data-id="' + t.id + '" style="background: none; border: none; color: #343235; font-size: 17px; padding: 6px 8px;">×</button>'
      + '</div>';
  }

  function isTyping() {
    var a = document.activeElement;
    return !!(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA'));
  }
  var pendingPassive = false;

  function render(passive) {
    if (passive && isTyping()) { pendingPassive = true; return; }
    var open = S.tasks.filter(function (t) { return !t.done; });
    var done = S.tasks.filter(function (t) { return t.done; });

    var body = open.length
      ? '<div style="margin-top: 30px;">' + open.map(taskLine).join('') + '</div>'
      : '<div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 70px 0;">'
        + '<span style="font-size: 16px; color: ' + DIM + ';">Nothing to do.</span></div>';

    if (done.length) {
      body += '<div style="margin-top: 34px;">'
        + '<button class="tap" data-act="toggleDone" style="background: none; border: none; padding: 6px 0; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: ' + DIM + ';">Done · ' + done.length + '</button>'
        + (S.showDone ? done.map(taskLine).join('') : '') + '</div>';
    }

    var addBar = S.adding
      ? '<div style="border-top: 1px solid ' + LINE + '; background: #0e0e0f; padding: 14px 22px calc(14px + env(safe-area-inset-bottom));">'
        + '<div style="display: flex; align-items: center; gap: 14px;">'
        + '<span style="color: ' + DIM + '; font-size: 17px;">+</span>'
        + '<input id="newTask" placeholder="Add a task" autocomplete="off" autocapitalize="sentences" enterkeyhint="done" style="flex: 1; background: none; border: none; color: ' + TEXT + '; font-size: 16.5px; padding: 6px 0;" />'
        + '<button class="tap" data-act="save" style="background: none; border: none; color: ' + (['#b08b90','#f0eee6','#779f7c','#78959b'].indexOf(K.prefs().accent) === -1 ? '#b08b90' : K.prefs().accent) + '; font-size: 11.5px; letter-spacing: 0.2em; text-transform: uppercase; padding: 8px 2px;">Add</button></div></div>'
      : '<button class="tap" data-act="add" style="width: 100%; border: none; border-top: 1px solid ' + LINE + '; background: #0e0e0f; color: ' + MUTED + '; display: flex; align-items: center; gap: 16px; padding: 20px 22px calc(20px + env(safe-area-inset-bottom)); font-size: 16.5px; text-align: left;">'
        + '<span style="color: ' + DIM + '; font-size: 17px;">+</span><span>Add a task</span></button>';

    document.getElementById('app').innerHTML =
      '<div style="min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; background: #0e0e0f; padding-top: env(safe-area-inset-top);">'
      + '<div style="width: 100%; max-width: 620px; margin: 0 auto; flex: 1; display: flex; flex-direction: column;">'
      + '<div style="display: flex; align-items: center; justify-content: center; padding: 22px 20px 0;">'
      + '<button class="tap" data-act="back" style="background: none; border: none; color: ' + MUTED + '; font-size: 11.5px; letter-spacing: 0.22em; text-transform: uppercase; padding: 8px 4px;">‹ Planner</button></div>'
      + '<div style="flex: 1; display: flex; flex-direction: column; padding: 0 22px 20px;">'
      + '<h1 style="margin: 14px 0 0; font-size: 44px; font-weight: 200; letter-spacing: -0.02em; color: ' + TEXT + ';">Tasks</h1>'
      + '<div style="margin-top: 8px; font-size: 11.5px; letter-spacing: 0.2em; text-transform: uppercase; color: ' + DIM + ';">' + (open.length ? open.length + ' open' : 'All clear') + '</div>'
      + body + '</div>' + addBar + '</div></div>';

    var f = document.getElementById('newTask');
    if (f && document.activeElement !== f) f.focus();
  }

  document.addEventListener('focusout', function () {
    setTimeout(function () {
      if (pendingPassive && !isTyping()) { pendingPassive = false; render(); }
    }, 60);
  });

  function save() {
    var input = document.getElementById('newTask');
    if (input && input.value.trim()) { S.tasks = K.addTask(input.value, S.cat); K.buzz(12); input.value = ''; }
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'newTask') { save(); render(); }
    if (e.key === 'Escape') { S.adding = false; render(); }
  });

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    switch (el.getAttribute('data-act')) {
      case 'back': K.buzz(8); window.location.href = 'index.html'; return;
      case 'add': S.adding = true; break;
      case 'save': save(); break;
      case 'toggle': S.tasks = K.toggleTask(el.getAttribute('data-id')); K.buzz(14); break;
      case 'del': S.tasks = K.removeTask(el.getAttribute('data-id')); K.buzz(18); break;
      case 'toggleDone': S.showDone = !S.showDone; break;
      default: return;
    }
    render();
  });

  window.addEventListener('pageshow', function () { S.tasks = K.tasks(); render(true); });
  window.addEventListener('storage', function () { S.tasks = K.tasks(); render(true); });

  render();
  K.Sync.onChange(function () { S.tasks = K.tasks(); render(true); });
  K.Sync.start();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
